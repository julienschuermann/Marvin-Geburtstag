<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>30. Geburtstag Wordle</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#000,#2b1b00);
  color:white;
  text-align:center;
  user-select:none;
}

h1{
  color:gold;
  margin:15px 0;
}

#board{
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:center;
  margin-top:10px;
}

.row{
  display:flex;
  gap:5px;
}

.tile{
  width:42px;
  height:42px;
  border:2px solid #555;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  text-transform:uppercase;
  font-size:20px;
}

#keyboard{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:center;
}

.keyrow{
  display:flex;
  gap:5px;
}

.key{
  padding:10px;
  min-width:28px;
  background:#444;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}

.key.green{background:green;}
.key.yellow{background:gold;color:black;}
.key.gray{background:#222;color:#666;}

#msg{
  margin-top:10px;
  font-size:22px;
  color:gold;
}

.confetti{
  position:fixed;
  width:8px;
  height:8px;
  top:-10px;
  animation:fall 3s linear forwards;
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);}
}
</style>
</head>

<body>

<h1>🎂 30. Geburtstag 🎂</h1>

<div id="board"></div>

<div id="keyboard"></div>

<div id="msg"></div>

<script>
const WORD = "STRYCK";
const LEN = 6;
let row = 0;
let current = "";

// Board bauen
const board = document.getElementById("board");

for(let i=0;i<6;i++){
  let r = document.createElement("div");
  r.className = "row";
  for(let j=0;j<LEN;j++){
    let t = document.createElement("div");
    t.className = "tile";
    r.appendChild(t);
  }
  board.appendChild(r);
}

// Keyboard Layout
const layout = [
"QWERTZUIOP",
"ASDFGHJKL",
"YXCVBNM"
];

const keyboard = document.getElementById("keyboard");

layout.forEach(line=>{
  let rowDiv = document.createElement("div");
  rowDiv.className = "keyrow";

  [...line].forEach(letter=>{
    let key = document.createElement("div");
    key.className = "key";
    key.innerText = letter;

    key.onclick = ()=>handleKey(letter);

    rowDiv.appendChild(key);
  });

  keyboard.appendChild(rowDiv);
});

// Eingabe
document.addEventListener("keydown",e=>{
  let k = e.key.toUpperCase();
  if(k==="BACKSPACE"){
    current = current.slice(0,-1);
  }else if(/^[A-Z]$/.test(k)){
    if(current.length < LEN) current += k;
  }else if(k==="ENTER"){
    if(current.length === LEN) check();
  }
  draw();
});

function handleKey(k){
  if(current.length < LEN){
    current += k;
  }
  draw();
}

// Board zeichnen
function draw(){
  let tiles = document.querySelectorAll(".row")[row].children;

  for(let i=0;i<LEN;i++){
    tiles[i].textContent = current[i] || "";
  }
}

// Prüfen
function check(){
  let tiles = document.querySelectorAll(".row")[row].children;

  let solution = WORD.split("");
  let guess = current.split("");

  let keyStates = {};

  for(let i=0;i<LEN;i++){
    if(guess[i] === solution[i]){
      tiles[i].style.background="green";
      keyStates[guess[i]]="green";
    }
    else if(solution.includes(guess[i])){
      tiles[i].style.background="gold";
      if(keyStates[guess[i]]!=="green")
        keyStates[guess[i]]="yellow";
    }
    else{
      tiles[i].style.background="#333";
      if(!keyStates[guess[i]])
        keyStates[guess[i]]="gray";
    }
  }

  updateKeyboard(keyStates);

  if(current === WORD){
    win();
  }

  row++;
  current="";
}

// Tastatur einfärben
function updateKeyboard(states){
  document.querySelectorAll(".key").forEach(k=>{
    let l = k.innerText;
    if(states[l]){
      k.className = "key " + states[l];
    }
  });
}

// Gewinn
function win(){
  document.getElementById("msg").innerHTML =
  "🎉 Herzlichen Glückwunsch zum 30. Geburtstag! 🎉";

  for(let i=0;i<120;i++){
    let c = document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=["red","gold","blue","pink"][Math.floor(Math.random()*4)];
    c.style.animationDuration=(Math.random()*2+2)+"s";
    document.body.appendChild(c);
  }
}
</script>

</body>
</html>
