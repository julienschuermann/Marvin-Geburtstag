<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>30. Geburtstag Wordle</title>

<style>
:root{
  --tile-gap:clamp(4px,1.2vw,6px);
  --tile-size:min(52px,calc((100vw - 24px - 5 * var(--tile-gap)) / 6));
  --key-gap:clamp(3px,1vw,5px);
  --key-min:clamp(24px,8.5vw,36px);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}

*{
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  min-height:100dvh;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#000,#2b1b00);
  color:white;
  text-align:center;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  overflow-x:hidden;
  padding:
    calc(12px + var(--safe-top))
    calc(12px + var(--safe-right))
    calc(16px + var(--safe-bottom))
    calc(12px + var(--safe-left));
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1{
  color:gold;
  margin:8px 0 12px;
  font-size:clamp(1.1rem,4.5vw,1.75rem);
  line-height:1.2;
  max-width:100%;
}

#board{
  display:flex;
  flex-direction:column;
  gap:var(--tile-gap);
  align-items:center;
  margin-top:6px;
  width:100%;
  max-width:calc(6 * var(--tile-size) + 5 * var(--tile-gap));
}

.row{
  display:flex;
  gap:var(--tile-gap);
  justify-content:center;
  width:100%;
}

.tile{
  width:var(--tile-size);
  height:var(--tile-size);
  flex:0 0 var(--tile-size);
  border:2px solid #555;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  text-transform:uppercase;
  font-size:clamp(16px,calc(var(--tile-size) * 0.42),22px);
}

#keyboard{
  margin-top:clamp(16px,4vw,24px);
  display:flex;
  flex-direction:column;
  gap:var(--key-gap);
  align-items:center;
  width:100%;
  max-width:520px;
}

.keyrow{
  display:flex;
  gap:var(--key-gap);
  justify-content:center;
  width:100%;
}

.key{
  padding:clamp(10px,2.8vw,12px) clamp(6px,1.8vw,10px);
  min-width:var(--key-min);
  min-height:44px;
  background:#444;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
  font-size:clamp(13px,3.6vw,16px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 1 auto;
}

.key.wide{
  min-width:clamp(52px,18vw,72px);
  flex:1 1 auto;
  max-width:96px;
}

.key:active{
  transform:scale(0.95);
  filter:brightness(1.15);
}

.key.green{background:green;}
.key.yellow{background:gold;color:black;}
.key.gray{background:#222;color:#666;}

#msg{
  margin-top:clamp(10px,3vw,16px);
  font-size:clamp(1rem,4.5vw,1.35rem);
  color:gold;
  line-height:1.4;
  padding:0 8px;
  max-width:36rem;
}

.confetti{
  position:fixed;
  width:8px;
  height:8px;
  top:-10px;
  animation:fall 3s linear forwards;
  pointer-events:none;
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);}
}

@media (max-width:380px){
  :root{
    --tile-size:min(46px,calc((100vw - 20px - 5 * var(--tile-gap)) / 6));
  }
}
</style>
</head>

<body>

<h1>🎂 30. Geburtstag 🎂</h1>

<div id="board"></div>
<div id="keyboard"></div>
<div id="msg"></div>

<script>

const WORD = "STRYCK";
const LEN = 6;

let row = 0;
let current = "";

// BOARD
const board = document.getElementById("board");

for(let i=0;i<6;i++){
  let r = document.createElement("div");
  r.className = "row";

  for(let j=0;j<LEN;j++){
    let t = document.createElement("div");
    t.className = "tile";
    r.appendChild(t);
  }

  board.appendChild(r);
}

// KEYBOARD
const layout = [
"QWERTZUIOP",
"ASDFGHJKL",
"YXCVBNM"
];

const keyboard = document.getElementById("keyboard");

layout.forEach(line=>{
  let rowDiv = document.createElement("div");
  rowDiv.className = "keyrow";

  [...line].forEach(letter=>{
    let key = document.createElement("div");
    key.className = "key";
    key.innerText = letter;
    key.onclick = ()=>handleKey(letter);
    rowDiv.appendChild(key);
  });

  keyboard.appendChild(rowDiv);
});

let actionRow = document.createElement("div");
actionRow.className = "keyrow";

let backKey = document.createElement("div");
backKey.className = "key wide";
backKey.innerText = "⌫";
backKey.onclick = ()=>handleBackspace();
actionRow.appendChild(backKey);

keyboard.appendChild(actionRow);

// INPUT
document.addEventListener("keydown",e=>{
  let k = e.key.toUpperCase();

  if(k==="BACKSPACE"){
    handleBackspace();
    return;
  }

  else if(/^[A-Z]$/.test(k)){
    if(current.length < LEN) current += k;
  }

  else if(k==="ENTER"){
    if(current.length === LEN) check();
  }

  draw();
});

function handleBackspace(){
  current = current.slice(0,-1);
  draw();
}

function handleKey(k){
  if(current.length < LEN){
    current += k;
  }

  draw();

  // AUTO CHECK
  if(current.length === LEN){
    setTimeout(check, 120);
  }
}

// DRAW
function draw(){
  let tiles = document.querySelectorAll(".row")[row].children;

  for(let i=0;i<LEN;i++){
    tiles[i].textContent = current[i] || "";
  }
}

// CHECK LOGIC (korrekt Wordle-style)
function check(){

  let tiles = document.querySelectorAll(".row")[row].children;

  let solution = WORD.split("");
  let guess = current.split("");

  let solutionCopy = [...solution];
  let colors = Array(LEN).fill("gray");

  // Grün
  for(let i=0;i<LEN;i++){
    if(guess[i] === solution[i]){
      colors[i] = "green";
      solutionCopy[i] = null;
    }
  }

  // Gelb
  for(let i=0;i<LEN;i++){
    if(colors[i] !== "green"){
      let idx = solutionCopy.indexOf(guess[i]);
      if(idx !== -1){
        colors[i] = "gold";
        solutionCopy[idx] = null;
      }
    }
  }

  // Tiles färben
  for(let i=0;i<LEN;i++){
    tiles[i].style.background =
      colors[i]==="green" ? "green" :
      colors[i]==="gold" ? "gold" : "#333";
  }

  // Keyboard update
  let keyStates = {};

  for(let i=0;i<LEN;i++){
    let l = guess[i];

    if(colors[i]==="green"){
      keyStates[l]="green";
    }
    else if(colors[i]==="gold" && keyStates[l]!=="green"){
      keyStates[l]="yellow";
    }
    else if(!keyStates[l]){
      keyStates[l]="gray";
    }
  }

  updateKeyboard(keyStates);

  // WIN
  if(current === WORD){
    win();
    return;
  }

  // NEXT ROW
  row++;
  current="";
}

// KEYBOARD COLORS
function updateKeyboard(states){
  document.querySelectorAll(".key").forEach(k=>{
    let l = k.innerText;
    if(states[l]){
      k.className = "key " + states[l];
    }
  });
}

// WIN SCREEN
function win(){
  document.getElementById("msg").innerHTML =
  "🎉 Herzlichen Glückwunsch zum 30. Geburtstag! 🎉";

  for(let i=0;i<120;i++){
    let c = document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=["red","gold","blue","pink"][Math.floor(Math.random()*4)];
    c.style.animationDuration=(Math.random()*2+2)+"s";
    document.body.appendChild(c);
  }
}

</script>

</body>
</html>
