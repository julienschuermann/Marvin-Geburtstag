<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>30. Geburtstag Wordle</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#000,#2b1b00);
  color:white;
  text-align:center;
}
h1{color:gold;margin-top:20px;}
#game{display:flex;flex-direction:column;gap:5px;align-items:center;margin-top:20px;}
.row{display:flex;gap:5px;}
.tile{
  width:40px;height:40px;
  border:2px solid #555;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  text-transform:uppercase;
}
input{
  position:absolute;
  opacity:0;
}
#msg{color:gold;font-size:24px;margin-top:10px;}
button{margin-top:10px;padding:10px 20px;}
.confetti{
  position:fixed;
  width:8px;height:8px;
  top:-10px;
  animation:fall 3s linear forwards;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);}
}
</style>
</head>
<body>

<h1>🎂 30. Geburtstag 🎂</h1>

<div id="game"></div>
<div id="msg"></div>
<button onclick="reset()">Nochmal</button>

<input id="input" maxlength="6" autofocus>

<script>
const WORD="STRYCK";
let row=0;

const game=document.getElementById("game");

for(let i=0;i<6;i++){
  let r=document.createElement("div");
  r.className="row";
  for(let j=0;j<6;j++){
    let t=document.createElement("div");
    t.className="tile";
    r.appendChild(t);
  }
  game.appendChild(r);
}

const input=document.getElementById("input");

function focusInput(){
  input.focus();
}

document.addEventListener("click",focusInput);
window.onload=focusInput;

input.addEventListener("input",e=>{
  let val=e.target.value.toUpperCase();
  draw(val);

  if(val.length===6){
    check(val);
    input.value="";
  }
});

function draw(val){
  let tiles=document.querySelectorAll(".row")[row].children;
  for(let i=0;i<6;i++){
    tiles[i].textContent=val[i]||"";
  }
}

function check(val){
  let tiles=document.querySelectorAll(".row")[row].children;
  let word=WORD.split("");

  for(let i=0;i<6;i++){
    if(val[i]===word[i]){
      tiles[i].style.background="green";
    }else if(word.includes(val[i])){
      tiles[i].style.background="gold";
    }else{
      tiles[i].style.background="#333";
    }
  }

  if(val===WORD){
    win();
  }

  row++;
}

function win(){
  document.getElementById("msg").innerHTML=
  "🎉 Herzlichen Glückwunsch zum 30. Geburtstag! 🎉";

  for(let i=0;i<120;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=["red","gold","blue","pink"][Math.floor(Math.random()*4)];
    c.style.animationDuration=(Math.random()*2+2)+"s";
    document.body.appendChild(c);
  }
}

function reset(){
  location.reload();
}
</script>

</body>
</html>
